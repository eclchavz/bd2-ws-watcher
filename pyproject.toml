[project]
name = "bd2watcher"
version = "0.1.0"
description = "Watches Weiss Schwarz announcements and store stock, focused on Brown Dust 2 sealed product."
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
bd2watcher = "bd2watcher.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
