# Sources, watchlists and classification rules. Secrets go in .env, never here.

intervals:
  store_minutes: 10
  official_minutes: 60

alerts:
  cooldown_hours: 6
  dry_run: false   # true logs alerts instead of sending them

user_agent: "bd2-ws-watcher/0.1 (personal stock checker; +https://github.com/eclchavz/bd2-ws-watcher)"

watchlists:
  - series: Brown Dust 2
    keywords: ["Brown Dust 2", "BrownDust2", "ブラウンダスト2"]

# Checked in order: a title matching `single` is dropped first, then supply, then sealed.
# Anything matching none of them is kind `other` and is dropped.
kinds:
  single:
    patterns: ['[A-Z0-9]+/[A-Z0-9]+-[A-Z]?\d+']
    product_types: ["Single", "Singles"]
  supply: ["sleeve", "playmat", "play mat", "deck box", "deck case", "storage box", "スリーブ", "プレイマット", "デッキケース"]
  sealed: ["booster", "box", "case", "trial deck", "starter", "ブースター", "トライアルデッキ", "カートン"]

# Groups the same sealed product across stores. First match wins, so order matters.
products:
  - name: Booster Case
    keywords: ["case", "carton", "カートン", "x12"]
  - name: Booster Box
    keywords: ["box", "ボックス"]
  - name: Trial Deck
    keywords: ["trial deck", "トライアルデッキ", "starter"]
  - name: Booster Pack
    keywords: ["booster pack", "pack", "パック"]

# A title containing any of these is the English edition. Everything else is Japanese.
english_markers: ["english", "en"]

preorder_markers: ["pre-order", "preorder", "予約"]

# Stores are checked every intervals.store_minutes. A disabled store is skipped until
# `bd2watcher discover` confirms its platform, currency and best products_path.
# Prefer a Weiss Schwarz collection path over /products.json: it's far fewer requests.
sources:
  - name: tcg-corner
    label: TCG Corner
    adapter: shopify
    base_url: https://tcg-corner.com
    products_path: /products.json
    currency: USD          # unconfirmed: run discover

  - name: japan-figure
    label: Japan-Figure
    adapter: shopify
    base_url: https://japan-figure.com
    products_path: /products.json
    currency: USD          # unconfirmed: run discover
    enabled: false         # whole catalog is mostly figures: set a collection path first

  - name: flipside-gaming
    label: Flipside Gaming
    adapter: shopify
    base_url: https://flipsidegaming.com
    products_path: /products.json
    currency: USD          # unconfirmed: run discover
    enabled: false

  - name: jump-ichiban
    label: Jump Ichiban
    adapter: shopify
    base_url: https://jumpichiban.com
    products_path: /collections/weiss-schwarz-card-game-1/products.json  # seen in search results
    currency: USD          # unconfirmed: run discover
    enabled: false

  - name: lumius
    label: Lumius
    adapter: shopify       # platform unknown: run discover
    base_url: https://lumiusinc.com
    currency: USD          # unconfirmed: run discover
    enabled: false

  - name: hammer-girl
    label: Hammer Girl Anime
    adapter: shopify       # platform unknown: run discover
    base_url: https://www.hammergirlanime.com
    currency: USD          # unconfirmed: run discover
    enabled: false

  # A non-Shopify store uses the html adapter with CSS selectors. Example (WooCommerce):
