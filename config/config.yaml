# Sources, watchlists and classification rules. Secrets go in .env, never here.

intervals:
  store_minutes: 10
  official_minutes: 60

alerts:
  cooldown_hours: 6
  dry_run: false   # true logs alerts instead of sending them

user_agent: "bd2-ws-watcher/0.1 (personal stock checker; +https://github.com/eclchavz/bd2-ws-watcher)"

watchlists:
  - series: Brown Dust 2
    keywords: ["Brown Dust 2", "BrownDust2", "ブラウンダスト2"]

# Checked in order: a title matching `single` is dropped first, then supply, then sealed.
# Anything matching none of them is kind `other` and is dropped.
kinds:
  single:
    patterns: ['[A-Z0-9]+/[A-Z0-9]+-[A-Z]?\d+']
    product_types: ["Single", "Singles"]
  supply: ["sleeve", "playmat", "play mat", "deck box", "deck case", "storage box", "スリーブ", "プレイマット", "デッキケース"]
  sealed: ["booster", "box", "case", "trial deck", "starter", "ブースター", "トライアルデッキ", "カートン"]

preorder_markers: ["pre-order", "preorder", "予約"]

sources:
  # Platform and currency to be confirmed live in ticket 04.
  - name: tcg-corner
    label: TCG Corner
    adapter: shopify
    base_url: https://tcg-corner.com
    products_path: /products.json
    currency: USD
